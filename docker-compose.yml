version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: myteacher_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: myteacher_root_2024
      MYSQL_DATABASE: myteacher
      MYSQL_USER: myteacher_user
      MYSQL_PASSWORD: myteacher_pass_2024
    ports:
      - "3306:3306"
    volumes:
      - myteacher_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: myteacher_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mysql

volumes:
  myteacher_data:
